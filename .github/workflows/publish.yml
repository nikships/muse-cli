name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read

# Keep pending releases instead of replacing an older pending push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'releases' }}
  queue: max

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Queued runs need previous automated version bumps.
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Bump patch version on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/bump_version.py

      - name: Read release version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/muse_cli/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/muse_cli/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Run unit tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/muse-cli --version
          /tmp/smoke/bin/muse-cli --help
          /tmp/smoke/bin/muse-cli chat --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-version
          path: src/muse_cli/__init__.py

  record-release:
    name: Commit version and tag
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: src/muse_cli/

      - name: Push tested version and tag atomically
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/muse_cli/__init__.py
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "muse-cli $VERSION"
          # Fail before publishing if main advanced during testing; never force-push.
          # GITHUB_TOKEN pushes do not start recursive workflow runs.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

  publish:
    name: Publish to PyPI
    needs: [build, record-release]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.record-release.result == 'success' ||
       (needs.record-release.result == 'skipped' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/muse-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release with built files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
